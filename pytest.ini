[pytest]
# importlib : les tests des capacités (capabilities/*/tests/) peuvent porter les mêmes noms de fichiers
# que ceux de tests/ ; pythonpath : la racine du dépôt (paquets tools, bot, capabilities).
addopts = --import-mode=importlib -m "not reseau and not navigateur"
pythonpath = .
testpaths = tests capabilities
markers =
    reseau: test qui a besoin du réseau ou d'un service local (désélectionné par défaut ; lancer avec -m reseau)
    navigateur: test de bout en bout du front dans Chromium (désélectionné par défaut ; lancer avec -m navigateur)
