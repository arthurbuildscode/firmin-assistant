# Firmin Assistant — durcissement SSH (lot 5d, audit point 4).
# Déployé dans /etc/ssh/sshd_config.d/10-homeos.conf UNIQUEMENT par `install.sh --fermer-root`, après
# vérification (compte admin, clé, sudo) et `sshd -t`. Le préfixe 10- passe avant 50-cloud-init.conf :
# avec sshd, la première valeur lue l'emporte.
# __ADMIN__ est remplacé par le compte d'administration (défaut : admin, option --admin=<compte>).
PermitRootLogin no
AllowUsers __ADMIN__
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
