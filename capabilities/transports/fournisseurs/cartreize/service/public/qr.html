<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  .etiquettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .etiquette { text-align: center; page-break-inside: avoid; background: #fff; color: #000; border-color: #ccc; }
  .etiquette svg { width: 180px; height: 180px; }
  .etiquette h3 { margin: 6px 0 2px; font-size: 1.1rem; }
  .etiquette p { margin: 2px 0; font-size: .9rem; }
  .etiquette code { font-size: .65rem; word-break: break-all; color: #555; }
  label input { width: 100%; padding: 10px; font: inherit; margin-top: 4px; border-radius: 10px; border: 1px solid var(--trait); }
  @media print { main { max-width: none; } .etiquette { box-shadow: none; } }
</style>
</head>
<body>
<main>
  <div class="ne-pas-imprimer">
    <a class="retour" href="/">‹ Toutes les lignes</a>
    <h1>QR codes</h1>
    <p class="commune" id="titre"></p>
    <label>Adresse publique du site<input id="base"></label>
    <p class="pied">Chaque QR code mène à la page « prochain bus » de l'arrêt, pour la ligne et le sens indiqués. Imprime avec Ctrl+P.</p>
  </div>
  <div class="etiquettes" id="etiquettes"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const base = document.getElementById("base");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let ligne;

function dessiner() {
  const racine = base.value.trim().replace(/\/+$/, "");
  const sens = ligne.sens.filter((s) => !q.get("s") || s.id === q.get("s"));
  document.getElementById("etiquettes").innerHTML = sens.flatMap((s) => s.arrets
    .filter((a) => !q.get("a") || a.id === q.get("a"))
    .map((a) => {
      const url = `${racine}/l/${ligne.id}/${s.id}/${a.id}`;
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      return `<section class="carte etiquette">
        <p><strong>Mon bus est-il passé ?</strong></p>
        ${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}
        <p><span class="badge" style="background:${ligne.couleur};color:${ligne.texte}">${esc(ligne.ligne)}</span> ${esc(s.libelle)}</p>
        <h3>${esc(a.nom)}</h3><code>${esc(url)}</code></section>`;
    })).join("");
}

base.addEventListener("input", dessiner);
Promise.all([
  fetch("/api/info").then((r) => r.json()).catch(() => ({})),
  fetch(`/api/ligne/${q.get("l") || ""}`).then((r) => { if (!r.ok) throw new Error("Choisis une ligne : /qr?l=12"); return r.json(); }),
]).then(([info, l]) => {
  ligne = l;
  base.value = info.urlPublique || location.origin;
  document.getElementById("titre").textContent = `Ligne ${l.ligne} · ${l.nom}`;
  dessiner();
}).catch((e) => { document.getElementById("titre").textContent = e.message; });
</script>
</body>
</html>
